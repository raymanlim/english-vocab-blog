<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#003153" />
    <meta
      name="description"
      content="AI × Finance English — 每天 5 个单词，用真实 AI、金融与科技语境学英语的个人知识博客。"
    />
    <title>每天英语单词 · AI × Finance English</title>

    <!--
      Open Graph / Twitter 卡片。

      ⚠️ og:url 必须写「对外稳定链接」——
         2026-10-18 迁移到 Cloudflare Pages 后改为 daily-vocab.pages.dev；
         旧 sg2 域名是 App Publishing 影子站，观察期结束后下线，不要再用。
         若将来再换域名，必须同步更新这里。

      ℹ️ 尚无 og:image —— 没有配图时社交平台会退化为纯文本卡片（仍带标题与描述）。
         将来补图时加：<meta property="og:image" content="<稳定链接>/og.png" />
         并把图片放到 public/ 下（Vite 会原样拷贝到 dist/）。
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="每天英语单词" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:title" content="每天英语单词 · AI × Finance English" />
    <meta
      property="og:description"
      content="AI × Finance English — 每天 5 个单词，用真实 AI、金融与科技语境学英语的个人知识博客。"
    />
    <meta property="og:url" content="https://daily-vocab.pages.dev/" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="每天英语单词 · AI × Finance English" />
    <meta
      name="twitter:description"
      content="AI × Finance English — 每天 5 个单词，用真实 AI、金融与科技语境学英语的个人知识博客。"
    />
  </head>
  <body>
    <!-- 🔴 SEO 语义兜底（2026-10-18 加）：React SPA 挂载前 HTML 无 h1，
         爬虫与无障碍工具看到的是空壳。此 h1 视觉隐藏（Clark 技巧：仍可被
         屏幕阅读器读取），挂载后 React 渲染的真实标题不影响。
         若前端已有可见 h1，仍无妨——一个页面允许多个语义标题。 -->
    <h1
      style="position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0"
    >
      每天英语单词 · AI × Finance English
    </h1>
    <div id="root"></div>

    <!--
      右下角背景音乐播放器（「一处安静的地方 A Quiet Place」）
      默认收起、默认不播放：只有用户点击才出声。容器 hidden + JS 渐进显露，
      禁用 JS 时不留下无效按钮。逻辑见 src/lib/bgm.ts（由 main.tsx 调用）。
    -->
    <div class="bgm" data-bgm hidden>
      <audio id="bgm-audio" preload="none" loop src="./a-quiet-place.mp3?v=1"></audio>

      <button class="bgm__toggle" type="button" data-bgm-toggle
              aria-expanded="false" aria-controls="bgm-panel"
              aria-label="打开背景音乐 · 一处安静的地方" title="背景音乐">
        <span class="bgm__eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span class="bgm__toggle-text">安静的地方</span>
      </button>

      <section class="bgm__panel" id="bgm-panel" aria-label="背景音乐" hidden>
        <div class="bgm__art">
          <img src="./a-quiet-place-cover.jpg?v=1" alt="" width="760" height="362" loading="lazy" decoding="async">
          <button class="bgm__close" type="button" data-bgm-close aria-label="收起播放器">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
                 stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
        <div class="bgm__body">
          <p class="bgm__title">A Quiet Place</p>
          <p class="bgm__title-alt">一处安静的地方</p>
          <p class="bgm__credit">RAYMAN PERSONAL THEME · ORIGINAL INSTRUMENTAL</p>
          <p class="bgm__motto">静而有光 · 思而有度</p>
          <p class="bgm__motto-sub">在文字与光影之间，留住思考的时间。</p>

          <div class="bgm__controls">
            <button class="bgm__play" type="button" data-bgm-play
                    aria-label="播放"
                    data-label-play="播放"
                    data-label-pause="暂停">
              <svg class="bgm__icon-play" viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>
              <svg class="bgm__icon-pause" viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M7 5h3.4v14H7zM13.6 5H17v14h-3.4z"/></svg>
            </button>
            <div class="bgm__timeline">
              <input class="bgm__seek" type="range" min="0" max="100" step="0.1" value="0"
                     data-bgm-seek aria-label="播放进度">
              <div class="bgm__time"><span data-bgm-current>0:00</span><span data-bgm-total>--:--</span></div>
            </div>
            <button class="bgm__mute" type="button" data-bgm-mute
                    aria-label="静音"
                    data-label-mute="静音"
                    data-label-unmute="取消静音">
              <svg class="bgm__icon-vol" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9a4 4 0 0 1 0 6"/></svg>
              <svg class="bgm__icon-muted" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l4 6M21 9l-4 6"/></svg>
            </button>
          </div>
          <input class="bgm__volume" type="range" min="0" max="1" step="0.01" value="0.35"
                 data-bgm-volume aria-label="音量">
          <p class="bgm__hint">仅在你点击后播放，不会自动开始。</p>
        </div>
      </section>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
