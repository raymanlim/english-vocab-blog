<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#003153" />
    <meta
      name="description"
      content="AI × Finance English — 每天 5 个单词，用真实 AI、金融与科技语境学英语的个人知识博客。"
    />
    <title>每天英语单词 · AI × Finance English</title>

    <!--
      Open Graph / Twitter 卡片。

      ⚠️ og:url 必须写「对外稳定链接」= <sandboxId>.sg2.agentos-app.run ——
         该域名跨多次重新发布始终有效；发布工具每次返回的 shareLink 是**临时域名**，
         下期即失效，绝不可写在这里。若 sandboxId 变更（账号迁移等）需同步更新。

      ℹ️ 尚无 og:image —— 没有配图时社交平台会退化为纯文本卡片（仍带标题与描述）。
         将来补图时加：<meta property="og:image" content="<稳定链接>/og.png" />
         并把图片放到 public/ 下（Vite 会原样拷贝到 dist/）。
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="每天英语单词" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:title" content="每天英语单词 · AI × Finance English" />
    <meta
      property="og:description"
      content="AI × Finance English — 每天 5 个单词，用真实 AI、金融与科技语境学英语的个人知识博客。"
    />
    <meta
      property="og:url"
      content="https://2b8e1fe3d97e4d389b683715b938d2cd.sg2.agentos-app.run/"
    />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="每天英语单词 · AI × Finance English" />
    <meta
      name="twitter:description"
      content="AI × Finance English — 每天 5 个单词，用真实 AI、金融与科技语境学英语的个人知识博客。"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
